{% extends "layout.html" %}

{% block title %}Create Group{% endblock %}
{% if get_flashed_messages() %}
    <header>
        <div class="alert alert-primary mb-0 text-center" role="alert">
            {{ get_flashed_messages() | join(" ") }}
        </div>
    </header>
{% endif %}

{% block main %}
    <div class="mb-4">
        <h2>Create a New Expense Group</h2>
    </div>
    <form action="/create_group" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="name" placeholder="Group Name (e.g., Roommates, Trip)" type="text" required>
        </div>
        <button class="btn btn-primary" type="submit">Create Group</button>
    </form>
{% endblock %}
