{% extends "layout.html" %}

{% block title %}
    Add Expense - {{ group.name }}
{% endblock %}

{% block main %}
    <div class="container py-4" style="max-width: 500px;">
        <h2 class="mb-3">Add Expense for {{ group.name }}</h2>

        <form action="/add_expense/{{ group.id }}" method="post">
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input autocomplete="off" autofocus class="form-control" id="description" name="description" placeholder="e.g. Dinner, Groceries" type="text" required>
            </div>

            <div class="mb-3">
                <label for="amount" class="form-label">Amount ($)</label>
                <input class="form-control" id="amount" name="amount" placeholder="0.00" type="number" step="0.01" min="0.01" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Add & Split Equally</button>
            <a href="/group/{{ group.id }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
{% endblock %}
