{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">Register</h3>
                    
                    <form action="/register" method="post">
                        <div class="mb-3">
                            <input autocomplete="off" autofocus class="form-control" name="username" placeholder="Username" type="text" required>
                        </div>
                        <div class="mb-3">
                            <input class="form-control" name="password" placeholder="Password" type="password" required>
                        </div>
                        <div class="mb-3">
                            <input class="form-control" name="confirmation" placeholder="Confirm Password" type="password" required>
                        </div>
                        
                        <!-- Submit button placed inside the container & card -->
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" type="submit">Register</button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">Already have an account? <a href="/login">Log In</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
